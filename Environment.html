<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>预防性环境公益诉讼“重大风险”司法裁判模拟器</title>
    <style>
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #f4f6f9;
            color: #333;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 5px solid #2c3e50;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #34495e;
        }
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            background-color: #f8f9fa;
        }
        .result-section {
            margin-top: 30px;
            padding: 20px;
            background-color: #eef2f5;
            border-radius: 8px;
            border-left: 5px solid #3498db;
        }
        .meter-container {
            width: 100%;
            height: 25px;
            background-color: #ddd;
            border-radius: 15px;
            overflow: hidden;
            margin: 15px 0;
        }
        .meter-fill {
            height: 100%;
            width: 0%;
            background-color: #2ecc71;
            transition: width 0.5s ease-in-out, background-color 0.5s ease-in-out;
        }
        .score-text {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }
        .judgment-text {
            font-family: 'Kaiti', 'STKaiti', serif; /* 判决书使用楷体增强沉浸感 */
            font-size: 18px;
            line-height: 1.6;
            color: #2c3e50;
            background: #fff;
            padding: 15px;
            border: 1px dashed #bdc3c7;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏛️ 预防性环境公益诉讼“重大风险”司法裁判模拟器</h1>
    
    <div class="form-group">
        <label>1. 物种与生态价值级别 (最高权重 35%)</label>
        <select id="ecoValue" onchange="calculateRisk()">
            <option value="0">普通区域 / 常见物种</option>
            <option value="15">省级 / 国家二级保护区或物种</option>
            <option value="35">国家一级 / 极危 / 濒危物种最后栖息地</option>
        </select>
    </div>

    <div class="form-group">
        <label>2. 损害的后果与可逆性 (最高权重 35%)</label>
        <select id="irreversibility" onchange="calculateRisk()">
            <option value="0">可完全人工修复且周期短</option>
            <option value="15">修复成本极高且周期漫长</option>
            <option value="35">绝对不可逆 / 造成物种区域性灭绝</option>
        </select>
    </div>

    <div class="form-group">
        <label>3. 科学证据与盖然性 (最高权重 20%)</label>
        <select id="evidence" onchange="calculateRisk()">
            <option value="0">纯属原告主观猜测 / 缺乏科学数据</option>
            <option value="10">有专家辅助人证言与科考支持（高度盖然性）</option>
            <option value="20">具有绝对确定性，必然会发生严重破坏</option>
        </select>
    </div>

    <div class="form-group">
        <label>4. 行政许可与合规状态 (最高权重 10%)</label>
        <select id="compliance" onchange="calculateRisk()">
            <option value="0">环评手续完全合法合规，无任何程序瑕疵</option>
            <option value="5">取得环评批复，但存在漏评重点物种等重大瑕疵</option>
            <option value="10">未取得环评批复（违法开工）</option>
        </select>
    </div>

    <div class="result-section">
        <div class="score-text">重大风险指数: <span id="scoreValue">0</span>% - <span id="riskLevel">无风险</span></div>
        <div class="meter-container">
            <div class="meter-fill" id="meterFill"></div>
        </div>
        <div class="judgment-text">
            <strong>【裁判说理摘要】</strong><br>
            <span id="judgmentReason">请在上方的下拉菜单中调整案件要素，以生成司法裁判推演结果。</span>
        </div>
    </div>
</div>

<script>
    function calculateRisk() {
        // 获取所有选择的值并转换为数字
        let v1 = parseInt(document.getElementById('ecoValue').value);
        let v2 = parseInt(document.getElementById('irreversibility').value);
        let v3 = parseInt(document.getElementById('evidence').value);
        let v4 = parseInt(document.getElementById('compliance').value);

        // 计算总分
        let totalScore = v1 + v2 + v3 + v4;
        
        // 更新 UI
        document.getElementById('scoreValue').innerText = totalScore;
        let meter = document.getElementById('meterFill');
        meter.style.width = totalScore + '%';

        let riskLevelText = "";
        let meterColor = "";
        let judgment = "";

        // 根据分数进行裁判逻辑分流
        if (totalScore >= 75) {
            riskLevelText = "重大风险成立";
            meterColor = "#e74c3c"; // 红色
            judgment = "本院认为：涉案项目所在区域具有极高的生态价值，且损害后果具有不可逆性。结合原告提交的科学证据，损害发生的可能性已达到高度盖然性。虽被告抗辩其具备部分行政许可，但依据《环境保护法》之预防为主原则及风险预防原则，行政合规不能阻却民事责任的承担。故依法认定本项目具有生态破坏之重大风险，判令被告立即停止建设，并采取消除风险之必要措施。";
        } else if (totalScore >= 45) {
            riskLevelText = "重大风险待定 / 有条件成立";
            meterColor = "#f1c40f"; // 黄色
            judgment = "本院认为：涉案项目虽存在一定的生态破坏风险，但现有科学证据尚未达到必然发生之高度盖然性，且损害后果存在一定的人工修复可能。为审慎起见，平衡生态保护与经济发展，本院判令涉案项目暂缓建设，限期由被告依法开展补充环境影响评价，并由本院依职权追加专业司法鉴定，视鉴定结果另行裁判。";
        } else {
            riskLevelText = "重大风险不成立";
            meterColor = "#2ecc71"; // 绿色
            judgment = "本院认为：原告未能充分举证证明涉案项目存在法定的“重大风险”。涉案区域并非重点保护的核心栖息地，且被告已取得合法有效的行政许可。在缺乏确凿科学数据支撑损害必然发生的前提下，司法不宜过度干预合法的行政审批与经济建设行为。故对原告要求停工之诉讼请求，依法予以驳回。";
        }

        document.getElementById('riskLevel').innerText = riskLevelText;
        meter.style.backgroundColor = meterColor;
        document.getElementById('judgmentReason').innerText = judgment;
    }

    // 页面加载时初始化一次
    window.onload = calculateRisk;
</script>

</body>
</html>
