<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐰 兔子城堡的魔法数学动画 🥕</title>
    <style>
        :root {
            --bg-color: #f7f0e6;
            --card-bg: #ffffff;
            --pixel-border: #3c2f2f;
            --pink: #ff85a2;
            --green: #70e000;
            --yellow: #ffb703;
            --blue: #4cc9f0;
            --purple: #bdb2ff;
        }

        body {
            background-color: var(--bg-color);
            /* 波点像素背景 */
            background-image: radial-gradient(var(--pixel-border) 15%, transparent 16%);
            background-size: 24px 24px;
            color: var(--pixel-border);
            font-family: "Chalkboard SE", "Comic Sans MS", "PingFang SC", "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2.2rem;
            color: #d81b60;
            text-align: center;
            margin: 10px 0;
            text-shadow: 3px 3px 0px #fff, 5px 5px 0px var(--pixel-border);
        }

        .main-container {
            background: var(--card-bg);
            border: 6px solid var(--pixel-border);
            border-radius: 20px;
            box-shadow: 10px 10px 0px var(--pixel-border);
            padding: 20px;
            max-width: 850px;
            width: 100%;
            box-sizing: border-box;
        }

        /* 关卡选择按钮 */
        .menu-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }

        .menu-btn {
            font-size: 1.1rem;
            font-weight: 900;
            padding: 8px 14px;
            background: #fff;
            border: 4px solid var(--pixel-border);
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 3px 3px 0 var(--pixel-border);
            transition: 0.1s;
        }

        .menu-btn.active {
            background: var(--pink);
            color: white;
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--pixel-border);
        }

        /* 动画舞台 */
        .stage {
            min-height: 380px;
            background: #eef9ff;
            border: 4px dashed var(--pixel-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 可视化物体图形区域 */
        .visual-area {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin: 15px 0;
            width: 100%;
        }

        .item-box {
            background: white;
            border: 4px solid var(--pixel-border);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.1);
            position: relative;
        }

        .item-group-title {
            font-size: 1.2rem;
            font-weight: 900;
            background: var(--yellow);
            padding: 2px 8px;
            border: 2px solid var(--pixel-border);
            border-radius: 6px;
            margin-bottom: 8px;
            display: inline-block;
        }

        /* SVG绘制的图标组合 */
        .icon-grid {
            display: flex;
            gap: 6px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            max-width: 280px;
            padding: 8px;
        }

        .item-icon {
            width: 42px;
            height: 42px;
        }

        /* 划掉/消去动画效果 */
        .cancel-out {
            position: relative;
            opacity: 0.4;
        }
        .cancel-out::after {
            content: "❌";
            font-size: 2rem;
            position: absolute;
            top: -5px;
            left: 5px;
        }

        /* 极大化文字对话框 */
        .dialog-box {
            background: #fff8ec;
            border: 4px solid var(--pixel-border);
            border-radius: 12px;
            padding: 15px;
            font-size: 1.35rem;
            font-weight: 800;
            line-height: 1.6;
            margin-top: 15px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 4px 4px 0 var(--pixel-border);
        }

        .highlight-num {
            font-size: 1.8rem;
            color: #d81b60;
            background: #ffe0b2;
            padding: 0 8px;
            border: 2px solid var(--pixel-border);
            border-radius: 8px;
        }

        /* 底部导航 */
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .nav-btn {
            font-size: 1.3rem;
            font-weight: 900;
            padding: 12px 24px;
            background: var(--green);
            color: white;
            border: 4px solid var(--pixel-border);
            border-radius: 12px;
            box-shadow: 4px 4px 0 var(--pixel-border);
            cursor: pointer;
        }

        .nav-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .bounce {
            animation: bounce 0.6s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <h1>🐰 兔子城堡的魔法数学动画 🥕</h1>

    <div class="main-container">
        <!-- 关卡选择按钮 -->
        <div class="menu-bar">
            <button class="menu-btn active" onclick="loadProblem(1)">例1：包子大赛</button>
            <button class="menu-btn" onclick="loadProblem(2)">例2：水果变魔术</button>
            <button class="menu-btn" onclick="loadProblem(3)">例3：打工换珍珠</button>
            <button class="menu-btn" onclick="loadProblem(4)">例4：玻璃球对决</button>
            <button class="menu-btn" onclick="loadProblem(5)">例5：班级人数谜题</button>
            <button class="menu-btn" onclick="loadProblem(6)">例6：分组大对决</button>
        </div>

        <div id="stepTag" style="font-size: 1.2rem; font-weight: 900; color:#5d4037; margin-bottom:10px;">STEP 1</div>

        <!-- 动画舞台 -->
        <div class="stage" id="stage"></div>

        <!-- 解说对话框 -->
        <div class="dialog-box" id="dialog"></div>

        <!-- 操作按钮 -->
        <div class="controls">
            <button class="nav-btn" id="prevBtn" onclick="prevStep()">◀ 上一步</button>
            <button class="nav-btn" id="nextBtn" onclick="nextStep()">下一步 ▶</button>
        </div>
    </div>

    <script>
        // SVG 图形元素生成器
        const SVG = {
            redBall: `<svg class="item-icon" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#ff4d6d" stroke="#3c2f2f" stroke-width="8"/><circle cx="35" cy="35" r="10" fill="#fff"/></svg>`,
            whiteBall: `<svg class="item-icon" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#ffffff" stroke="#3c2f2f" stroke-width="8"/><circle cx="35" cy="35" r="8" fill="#eee"/></svg>`,
            clothes: `<svg class="item-icon" viewBox="0 0 100 100"><path d="M20,30 L40,10 L60,10 L80,30 L70,45 L60,35 L60,85 L40,85 L40,35 L30,45 Z" fill="#4cc9f0" stroke="#3c2f2f" stroke-width="6"/></svg>`,
            coin: `<svg class="item-icon" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#ffb703" stroke="#3c2f2f" stroke-width="8"/><rect x="40" y="40" width="20" height="20" fill="#fff" stroke="#3c2f2f" stroke-width="4"/></svg>`,
            rice: `<svg class="item-icon" viewBox="0 0 100 100"><path d="M30,20 Q50,5 70,20 L80,80 Q50,95 20,80 Z" fill="#ffddd2" stroke="#3c2f2f" stroke-width="6"/><text x="35" y="60" font-size="30">米</text></svg>`,
            flour: `<svg class="item-icon" viewBox="0 0 100 100"><path d="M25,25 L75,25 L85,85 L15,85 Z" fill="#e8e8e8" stroke="#3c2f2f" stroke-width="6"/><text x="35" y="65" font-size="30">面</text></svg>`,
            bun: `<svg class="item-icon" viewBox="0 0 100 100"><path d="M15,70 Q15,20 50,20 Q85,20 85,70 Z" fill="#fff" stroke="#3c2f2f" stroke-width="6"/><path d="M40,20 Q50,35 60,20" fill="none" stroke="#3c2f2f" stroke-width="4"/></svg>`
        };

        const problems = {
            1: {
                title: "例1：包子大赛",
                steps: [
                    {
                        dialog: "👀 <b>看一看</b>：我们把 4 个小伙伴分成两组！<br>第一组（高高+卡莉娅）一共包了 <span class='highlight-num'>87 个</span>包子。",
                        render: () => `
                            <div class="visual-area">
                                <div class="item-box">
                                    <div class="item-group-title">第一组 (高高+卡莉娅)</div>
                                    <div class="icon-grid">${SVG.bun}${SVG.bun}</div>
                                    <div style="font-size:2rem; font-weight:900; color:#d81b60;">87 个</div>
                                </div>
                                <div style="font-size:3rem; font-weight:900;">VS</div>
                                <div class="item-box">
                                    <div class="item-group-title">第二组 (思思+萱萱)</div>
                                    <div class="icon-grid">${SVG.bun}${SVG.bun}</div>
                                    <div style="font-size:2rem; font-weight:900; color:#4cc9f0;">？ 个</div>
                                </div>
                            </div>
                        `
                    },
                    {
                        dialog: "🔍 <b>比一比</b>：第二组跟第一组比有什么不一样？<br>思思少包 3 个（<span style='color:red;'>-3</span>），萱萱多包 9 个（<span style='color:green;'>+9</span>）。",
                        render: () => `
                            <div class="visual-area">
                                <div class="item-box">
                                    <div class="item-group-title">第二组比第一组</div>
                                    <div style="font-size:1.6rem; margin:15px 0;">
                                        少了 3 个，又多了 9 个！<br>
                                        相当于<b>整整多拿了 <span class='highlight-num'>+6 个</span></b>！
                                    </div>
                                </div>
                            </div>
                        `
                    },
                    {
                        dialog: "💡 <b>变魔术</b>：第二组的数量 = 第一组(87) + 多出的6个 = <span class='highlight-num'>93 个</span>！",
                        render: () => `
                            <div class="visual-area">
                                <div class="item-box">
                                    <div class="item-group-title">第一组</div>
                                    <div style="font-size:2rem; font-weight:900;">87 个</div>
                                </div>
                                <div style="font-size:3rem;">+</div>
                                <div class="item-box" style="background:#e8f5e9;">
                                    <div class="item-group-title">第二组</div>
                                    <div style="font-size:2rem; font-weight:900; color:#2e7d32;">93 个</div>
                                </div>
                            </div>
                        `
                    },
                    {
                        dialog: "🎉 <b>太棒啦</b>：两组加在一起：<span class='highlight-num'>87 + 93 = 180 个</span>！成功算出！",
                        render: () => `<div class="bounce" style="font-size:3rem; text-align:center;">👑 180 个包子！</div>`
                    }
                ]
            },
            3: {
                title: "例3：打工换珍珠（图解抵消）",
                steps: [
                    {
                        dialog: "👀 <b>看图对比</b>：把两次打工拿到的报酬摆在一起！",
                        render: () => `
                            <div class="visual-area" style="flex-direction:column;">
                                <div class="item-box" style="width:80%;">
                                    <div class="item-group-title">干 30 天</div>
                                    <div class="icon-grid">${SVG.clothes} + 💰💰💰💰 (1000元)</div>
                                </div>
                                <div class="item-box" style="width:80%;">
                                    <div class="item-group-title">干 10 天</div>
                                    <div class="icon-grid">${SVG.clothes} + 💰 (200元)</div>
                                </div>
                            </div>
                        `
                    },
                    {
                        dialog: "✂️ <b>擦掉相同的部分</b>：把两边的“工作服”同时拿掉！<br>少干的 <span class='highlight-num'>20 天</span>，正好少拿了 <span class='highlight-num'>800 元</span>！",
                        render: () => `
                            <div class="visual-area">
                                <div class="item-box" style="background:#ffebee;">
                                    <div class="item-group-title">少干 20 天</div>
                                    <div style="font-size:1.8rem; font-weight:900;">工资差 = 1000 - 200 = 800 元</div>
                                    <div style="font-size:1.4rem; color:#2e7d32; margin-top:10px;">👉 1天工钱 = 800 ÷ 20 = <b>40 元</b></div>
                                </div>
                            </div>
                        `
                    },
                    {
                        dialog: "🎉 <b>得出答案</b>：干 10 天该得 400 元。扣掉 200 元现金，<b>工作服就值 <span class='highlight-num'>200 元</span></b>！",
                        render: () => `
                            <div class="bounce" style="text-align:center;">
                                ${SVG.clothes}
                                <div style="font-size:2rem; font-weight:900; margin-top:10px;">工作服 = 200 元！</div>
                            </div>
                        `
                    }
                ]
            },
            4: {
                title: "例4：红白玻璃球",
                steps: [
                    {
                        dialog: "👀 <b>看一看</b>：红球是白球的 3 倍。我们把它们打包成<b>【1个白球 + 3个红球】</b>的小分队！",
                        render: () => `
                            <div class="visual-area">
                                <div class="item-box" style="border-color:#ff8400;">
                                    <div class="item-group-title">1个标准小分队</div>
                                    <div class="icon-grid">
                                        ${SVG.whiteBall} ${SVG.redBall}${SVG.redBall}${SVG.redBall}
                                    </div>
                                </div>
                            </div>
                        `
                    },
                    {
                        dialog: "📦 <b>拿走球球</b>：每次拿走 7个白球 + 15个红球。<br>但如果是按标准小分队拿，7个白球应该配 <span class='highlight-num'>21个红球</span>！",
                        render: () => `
                            <div class="visual-area">
                                <div class="item-box">
                                    <div class="item-group-title">按标准应该拿</div>
                                    <div style="font-size:1.5rem;">21 个红球</div>
                                </div>
                                <div style="font-size:2.5rem;">VS</div>
                                <div class="item-box" style="background:#fff3e0;">
                                    <div class="item-group-title">实际只拿了</div>
                                    <div style="font-size:1.5rem; color:#d81b60;">15 个红球</div>
                                </div>
                            </div>
                        `
                    },
                    {
                        dialog: "🔍 <b>找突破口</b>：每次少拿了 <span class='highlight-num'>6个红球</span>！<br>最后箱子里剩了 54个红球，说明一共拿了：54 ÷ 6 = <b>9 次</b>！",
                        render: () => `
                            <div class="visual-area">
                                <div class="item-box" style="background:#e8f5e9;">
                                    <div style="font-size:1.6rem; font-weight:900;">一共拿了 9 次！</div>
                                </div>
                            </div>
                        `
                    },
                    {
                        dialog: "🎉 <b>算总数</b>：<br>⚪ 白球 = 9 × 7 = <span class='highlight-num'>63 个</span><br>🔴 红球 = 63 × 3 = <span class='highlight-num'>189 个</span>",
                        render: () => `
                            <div class="bounce" style="text-align:center;">
                                <div class="icon-grid" style="max-width:100%;">${SVG.whiteBall}${SVG.redBall}</div>
                                <div style="font-size:2rem; font-weight:900;">白球63个，红球189个！</div>
                            </div>
                        `
                    }
                ]
            },
            2: {
                title: "例2：水果变魔术",
                steps: [
                    {
                        dialog: "👀 <b>看条件</b>：火+水=83，水+金=86，金+木=88。谁出现了两次？<b>水龙果！</b>",
                        render: () => `<div style="font-size:1.8rem; text-align:center; font-weight:900;">🍎+💧=83 &nbsp;|&nbsp; 💧+🥇=86</div>`
                    },
                    {
                        dialog: "💡 <b>看差距</b>：比较前两组，水龙果一样大。<b>金龙果比火龙果整整多 <span class='highlight-num'>3 个</span>！</b>",
                        render: () => `<div class="item-box"><div style="font-size:1.8rem; font-weight:900;">🥇 金龙果 = 🍎 火龙果 + 3 个</div></div>`
                    },
                    {
                        dialog: "🎉 <b>替换求解</b>：金+木=88，把金换成(火+3)。<br>火龙果 + 木龙果 + 3 = 88 ➔ <b>火+木 = <span class='highlight-num'>85 个</span></b>！",
                        render: () => `<div class="bounce" style="font-size:2.2rem; font-weight:900; text-align:center;">🍎 + 🪵 = 85 个！</div>`
                    }
                ]
            },
            5: {
                title: "例5：班级人数谜题",
                steps: [
                    {
                        dialog: "👀 <b>看条件</b>：不算甲班有121人（乙+丙+丁=121）；不算丁班有134人（甲+乙+丙=134）。",
                        render: () => `<div style="font-size:1.5rem; font-weight:900;">乙+丙+丁 = 121<br>甲+乙+丙 = 134</div>`
                    },
                    {
                        dialog: "🔍 <b>两边对比</b>：都有“乙+丙”！<br>说明<b>甲班比丁班多 <span class='highlight-num'>134 - 121 = 13 人</span>！</b>",
                        render: () => `<div class="item-box"><div style="font-size:1.6rem; font-weight:900;">甲班 - 丁班 = 13 人</div></div>`
                    },
                    {
                        dialog: "🎉 <b>算总人数</b>：题目说丁班的2倍比甲班多9人。推算出丁班22人，甲班35人！四个班一共 <span class='highlight-num'>156 人</span>！",
                        render: () => `<div class="bounce" style="font-size:2.2rem; font-weight:900; text-align:center;">🏫 全年级 = 156 人！</div>`
                    }
                ]
            },
            6: {
                title: "例6：分组大对决",
                steps: [
                    {
                        dialog: "👀 <b>分组看</b>：把乙丙分成一组，甲丁分成一组。",
                        render: () => `<div style="font-size:1.5rem; font-weight:900;">(乙+丙) 与 (甲+丁) 对决！</div>`
                    },
                    {
                        dialog: "💡 <b>把所有条件加起来</b>：两组加起来刚好是全校人数的 2 倍！<br>得出两组和是 271 人，差是 1 人。",
                        render: () => `<div class="item-box"><div style="font-size:1.6rem; font-weight:900;">(乙+丙)的2倍 = 270 ➔ 乙+丙 = 90人</div></div>`
                    },
                    {
                        dialog: "🎉 <b>算出结果</b>：甲丁两班 = 91人，四个班一共 <span class='highlight-num'>181 人</span>！",
                        render: () => `<div class="bounce" style="font-size:2.2rem; font-weight:900; text-align:center;">🎉 四个班一共 = 181 人！</div>`
                    }
                ]
            }
        };

        let currentProblem = 1;
        let currentStep = 0;

        function loadProblem(probId) {
            currentProblem = probId;
            currentStep = 0;
            document.querySelectorAll('.menu-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx + 1 === probId);
            });
            updateView();
        }

        function updateView() {
            const prob = problems[currentProblem];
            const step = prob.steps[currentStep];

            document.getElementById('stepTag').innerText = `${prob.title} —— 第 ${currentStep + 1} / ${prob.steps.length} 步`;
            document.getElementById('stage').innerHTML = step.render();
            document.getElementById('dialog').innerHTML = step.dialog;

            document.getElementById('prevBtn').disabled = currentStep === 0;
            document.getElementById('nextBtn').disabled = currentStep === prob.steps.length - 1;
        }

        function nextStep() {
            if (currentStep < problems[currentProblem].steps.length - 1) {
                currentStep++;
                updateView();
            }
        }

        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                updateView();
            }
        }

        loadProblem(1);
    </script>
</body>
</html>
